# Delta over upstream's config_web_opensearch.yml — not runnable by itself;
# aiq/README.md has the numbered install steps.
#
# AI-Q Web-mode workflow with GroundX as the knowledge-layer backend.
# Only the knowledge_search block differs from upstream — the "decomposable
# knowledge layer" working exactly as designed.
#
# Everything below knowledge_search follows the upstream config; sections that
# are identical to config_web_opensearch.yml are elided here and should be
# copied from upstream at install time — this file documents the delta.

functions:
  knowledge_search:
    _type: knowledge_retrieval
    backend: groundx
    collection_name: ${COLLECTION_NAME:-nvidia-quickstart-demo}
    top_k: 5
    groundx_api_key: ${GROUNDX_API_KEY}
    groundx_base_url: ${GROUNDX_BASE_URL:-https://api.groundx.ai/api}

  # data_source_registry entry (merge into the upstream registry list):
  # - id: knowledge_layer
  #   name: "Knowledge Base (GroundX)"
  #   description: "Search complex enterprise documents with page-level citations."
  #   tools:
  #     - knowledge_search
