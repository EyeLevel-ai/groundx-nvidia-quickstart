# NeMo Agent Toolkit agent configuration: ReAct agent over GroundX document intelligence
# ("workflow" below is the toolkit's own config keyword — unrelated to GroundX workflows)
# - Tools: GroundX hosted MCP server (search + ingest), discovered dynamically
# - Agent LLM: Nemotron on a build.nvidia.com hosted NIM endpoint
# Keys come from the environment (.env) — never placed in tool arguments.

function_groups:
  groundx:
    _type: mcp_client
    server:
      transport: streamable-http
      url: "https://api.groundx.ai/mcp"
      custom_headers:
        X-API-Key: "${GROUNDX_API_KEY}"
    tool_call_timeout: 120

llms:
  nemotron:
    _type: openai
    model_name: nvidia/llama-3.3-nemotron-super-49b-v1.5
    base_url: https://integrate.api.nvidia.com/v1
    api_key: "${NVIDIA_API_KEY}"
    temperature: 0.2
    # Generous budget: this reasoning model thinks before answering; too small
    # a budget returns empty content (see docs/nemotron-engine.md, Gotcha 1)
    max_tokens: 4096

workflow:
  _type: react_agent
  llm_name: nemotron
  tool_names:
    - groundx
  verbose: true
  max_iterations: 8
  additional_instructions: |
    When calling search_content, ALWAYS include "n": 3 and "verbosity": 1 in the
    input to keep responses small. Answers must cite the page number from the
    result's boundingBoxes. When asked about a named bucket, first list buckets
    to resolve its id.
